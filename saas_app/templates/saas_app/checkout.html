{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Responsive-->
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <!-- fevicon -->
    <link rel="icon" href="{% static 'images/fevicon.png' %}" type="image/gif" />
    <style>
        /* Additional custom styles here */
    </style>
</head>

<body class="font-sans bg-gray-100">
    {% include 'saas_app/header.html' %}
    <!-- Header -->
    <div class="header_section header_bg">
        <!-- Header content -->
    </div>

    <!-- Main Content -->
    <div class="contact_section layout_padding">
        <div class="container mx-auto">
            <h1 class="text-3xl font-bold text-center mb-8">Checkout</h1>
            <!-- Checkout content -->
            <div class="max-w-lg mx-auto bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold text-purple-800 mb-4">Selected Subscription Plan:</h2>
                <p class="text-lg mb-2"><span class="font-bold">Name:</span> {{ selected_plan.name }}</p>
                <p class="text-lg mb-4"><span class="font-bold">Price:</span> ${{ selected_plan.price }}</p>
                <form action="{% url 'process_payment' %}" method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="plan_id" value="{{ selected_plan.id }}">
                    <button type="submit"
                        class="block w-full py-3 bg-red-500 text-white font-semibold rounded-lg shadow-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-red-200 transition duration-300 ease-in-out">Pay
                        with PayPal</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    <div class="footer_section layout_padding mt-20">
        <!-- Footer content -->
    </div>

    <!-- Scripts -->
    <script src="js/jquery.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-3.0.0.min.js"></script>
    <script src="js/plugin.js"></script>
    <script src="js/jquery.mCustomScrollbar.concat.min.js"></script>
    <script src="js/custom.js"></script>
    <script src="js/owl.carousel.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.js"></script>
</body>

</html>
